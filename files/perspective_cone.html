<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perspective Cone — N=2</title>
<style>
body.dark {
  --bg:#0f1117; --bg-canvas:#0a0e1a; --bg-card:#161b2e;
  --border:#1e2a3a; --border2:#2d3a50;
  --text:#e2e8f0; --text-muted:#94a3b8; --text-hint:#475569; --text-hdr:#64748b;
  --lbl:#cbd5e1; --num-bg:#0d1220;
  --btn-bg:#1e2a3a; --btn-hover:#243044;
  --btn-a-bg:#7c3522; --btn-a-bd:#f97316; --btn-a-tx:#fed7aa;
  --formula-bg:#161b2e; --formula-math:#e2e8f0;
  --input-bg:#0d1525; --input-bd:#2d3a50; --input-tx:#e2e8f0;
  --tag-bg:#1e3a20; --tag-tx:#4ade80;
  --err-bg:#3a1a1a; --err-tx:#f87171;
}
body.light {
  --bg:#f4f6fb; --bg-canvas:#ffffff; --bg-card:#ffffff;
  --border:#dde2ee; --border2:#c5cdde;
  --text:#1e2a3a; --text-muted:#5a6a82; --text-hint:#8a97a8; --text-hdr:#8a97a8;
  --lbl:#374151; --num-bg:#f0f4fa;
  --btn-bg:#eef1f7; --btn-hover:#e2e8f3;
  --btn-a-bg:#fff0e6; --btn-a-bd:#f97316; --btn-a-tx:#c2440a;
  --formula-bg:#fff8f2; --formula-math:#1e2a3a;
  --input-bg:#f8faff; --input-bd:#c5cdde; --input-tx:#1e2a3a;
  --tag-bg:#e6faf0; --tag-tx:#15803d;
  --err-bg:#fff0f0; --err-tx:#dc2626;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:20px 16px 32px;
  transition:background .25s,color .25s;
}
h1{font-size:22px;font-weight:500;margin-bottom:3px;}
.subtitle{font-size:13px;color:var(--text-muted);margin-bottom:14px;}

/* ── Top-right toggles ── */
#top-controls{
  position:absolute;top:18px;right:20px;
  display:flex;align-items:center;gap:14px;
}
/* Lang toggle */
#lang-toggle{
  display:flex;align-items:center;gap:0;
  border:1px solid var(--border2);border-radius:6px;overflow:hidden;
  font-size:12px;cursor:pointer;user-select:none;
}
.lang-btn{
  padding:4px 10px;background:var(--btn-bg);color:var(--text-muted);
  border:none;cursor:pointer;transition:background .15s,color .15s;font-size:12px;
}
.lang-btn.active{background:#f97316;color:#fff;}
/* Theme toggle */
#theme-toggle{
  display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none;
}
.tog-track{width:36px;height:20px;border-radius:10px;background:var(--border2);position:relative;transition:background .2s;flex-shrink:0;}
body.light .tog-track{background:#f97316;}
.tog-thumb{width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
body.light .tog-thumb{transform:translateX(16px);}

/* ── Canvas ── */
#pc-wrap{
  width:min(1060px,100%);aspect-ratio:16/9;
  border-radius:12px;overflow:hidden;
  border:1px solid var(--border);background:var(--bg-canvas);
  transition:background .25s,border-color .25s;
}
canvas{width:100%!important;height:100%!important;display:block;}

/* ── Mode tabs ── */
#mode-tabs{
  width:min(1060px,100%);margin-top:14px;
  display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;
}
.mode-tab{
  flex:1;padding:8px 0;text-align:center;font-size:12px;font-weight:500;
  cursor:pointer;background:var(--bg-card);color:var(--text-muted);
  border:none;transition:background .15s,color .15s;
}
.mode-tab.active{background:#f97316;color:#fff;}
.mode-tab:not(:last-child){border-right:1px solid var(--border);}

/* ── F input panel ── */
#f-panel{
  width:min(1060px,100%);margin-top:8px;
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:10px;padding:12px 16px;transition:background .25s;
}
#f-panel h3{font-size:11px;font-weight:500;color:var(--text-hdr);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
#pts-area{display:flex;flex-direction:column;gap:6px;}
.pt-row{display:flex;align-items:center;gap:6px;}
.pt-row input{
  width:68px;background:var(--input-bg);border:1px solid var(--input-bd);
  color:var(--input-tx);font-size:12px;padding:4px 6px;border-radius:5px;
  text-align:center;-moz-appearance:textfield;
}
.pt-row input::-webkit-inner-spin-button{-webkit-appearance:none;}
.pt-row .pt-lbl{font-size:12px;color:var(--text-muted);min-width:16px;}
.pt-row .rm-btn{font-size:11px;padding:2px 7px;cursor:pointer;border-radius:4px;border:1px solid var(--border2);background:var(--btn-bg);color:var(--text-muted);}
.pt-row .rm-btn:hover{background:var(--btn-hover);}
#add-pt-btn{font-size:12px;padding:4px 10px;cursor:pointer;border-radius:5px;border:1px dashed var(--border2);background:transparent;color:var(--text-muted);}
#add-pt-btn:hover{background:var(--btn-hover);}
#ineq-area{display:flex;flex-direction:column;gap:6px;}
.ineq-row{display:flex;align-items:center;gap:6px;}
.ineq-row input[type=text]{
  flex:1;background:var(--input-bg);border:1px solid var(--input-bd);
  color:var(--input-tx);font-size:12px;padding:5px 8px;border-radius:5px;font-family:monospace;
}
.ineq-row input[type=text]:focus{outline:1px solid #f97316;}
.ineq-row .rm-btn{font-size:11px;padding:2px 7px;cursor:pointer;border-radius:4px;border:1px solid var(--border2);background:var(--btn-bg);color:var(--text-muted);}
.ineq-row .rm-btn:hover{background:var(--btn-hover);}
#add-ineq-btn{font-size:12px;padding:4px 10px;cursor:pointer;border-radius:5px;border:1px dashed var(--border2);background:transparent;color:var(--text-muted);}
#add-ineq-btn:hover{background:var(--btn-hover);}
#ineq-hint{font-size:11px;color:var(--text-hint);margin-top:5px;line-height:1.5;}
#apply-btn{font-size:12px;padding:5px 16px;cursor:pointer;border-radius:6px;border:1px solid #f97316;background:#f97316;color:#fff;margin-top:8px;transition:opacity .15s;}
#apply-btn:hover{opacity:.88;}
#f-status{font-size:11px;margin-top:6px;padding:4px 8px;border-radius:4px;display:none;}
#f-status.ok{background:var(--tag-bg);color:var(--tag-tx);display:block;}
#f-status.err{background:var(--err-bg);color:var(--err-tx);display:block;}

/* ── Controls ── */
#controls{width:min(1060px,100%);margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ctrl-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:background .25s;}
.ctrl-card h3{font-size:11px;font-weight:500;color:var(--text-hdr);text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px;}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-row label{min-width:68px;font-size:12px;color:var(--text-muted);flex-shrink:0;}
.ctrl-row input[type=range]{flex:1;accent-color:#f97316;}
.ctrl-row .val{min-width:38px;text-align:right;font-size:12px;color:#f97316;font-variant-numeric:tabular-nums;}
.ctrl-row input[type=number]{width:52px;background:var(--num-bg);border:1px solid var(--border2);color:#f97316;font-size:12px;padding:2px 5px;border-radius:4px;text-align:center;-moz-appearance:textfield;}
.ctrl-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
button.ctrl-btn{font-size:12px;padding:5px 12px;cursor:pointer;border-radius:6px;border:1px solid var(--border2);background:var(--btn-bg);color:var(--text);transition:background .12s;}
button.ctrl-btn:hover{background:var(--btn-hover);}
button.ctrl-btn.active{background:var(--btn-a-bg);border-color:var(--btn-a-bd);color:var(--btn-a-tx);}
.chk-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--lbl);margin-bottom:6px;cursor:pointer;}
.chk-row:last-child{margin-bottom:0;}
.chk-row input{accent-color:#f97316;width:13px;height:13px;cursor:pointer;}
.reset-hint{font-size:11px;color:var(--text-hdr);margin-top:4px;margin-bottom:5px;}

/* ── Legend ── */
#legend{width:min(1060px,100%);margin-top:10px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);}
.leg{display:flex;align-items:center;gap:5px;}
.leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* ── Formula ── */
#formula{width:min(1060px,100%);margin-top:12px;background:var(--formula-bg);border:1px solid var(--border);border-left:3px solid #f97316;border-radius:10px;padding:12px 16px;font-size:13px;color:var(--text-muted);line-height:1.85;transition:background .25s;}
#formula .math{color:var(--formula-math);font-style:italic;}
#formula .hi{color:#f97316;}
.tip{margin-top:8px;font-size:11px;color:var(--text-hint);text-align:center;}
</style>
</head>
<body class="dark">

<div id="top-controls">
  <!-- Language toggle -->
  <div id="lang-toggle">
    <button class="lang-btn active" id="lang-zh" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
  </div>
  <!-- Theme toggle -->
  <label id="theme-toggle" title="">
    <span id="theme-label">🌙 Dark</span>
    <div class="tog-track"><div class="tog-thumb"></div></div>
  </label>
</div>

<h1 id="title">Perspective Cone &nbsp;—&nbsp; <span style="color:#f97316">N = 2</span></h1>
<p class="subtitle" id="subtitle">将 ℝ² 中的几何 𝒻 嵌入 ℝ³，从原点透视扫描形成锥体</p>

<div id="pc-wrap"><canvas id="pc"></canvas></div>

<div id="mode-tabs">
  <button class="mode-tab active" id="tab-pts" onclick="setMode('pts')" data-zh="📍 点集模式（手动输入顶点）" data-en="📍 Point Set Mode (enter vertices)">📍 点集模式（手动输入顶点）</button>
  <button class="mode-tab" id="tab-ineq" onclick="setMode('ineq')" data-zh="📐 区域模式（不等式刻画 𝒻）" data-en="📐 Region Mode (define 𝒻 by inequalities)">📐 区域模式（不等式刻画 𝒻）</button>
</div>

<div id="f-panel">
  <!-- Points mode -->
  <div id="pts-mode">
    <h3 id="pts-h3">𝒻 的点坐标（每行一个点）</h3>
    <div id="pts-area"></div>
    <button id="add-pt-btn" onclick="addPointRow()">＋ 添加点</button>
    <br>
    <button id="apply-btn" onclick="applyF()" style="margin-top:10px">▶ 更新几何</button>
    <div id="f-status"></div>
  </div>
  <!-- Inequalities mode -->
  <div id="ineq-mode" style="display:none">
    <h3 id="ineq-h3">用不等式刻画 𝒻 ⊂ ℝ²（变量：x1, x2）</h3>
    <div id="ineq-area"></div>
    <button id="add-ineq-btn" onclick="addIneqRow()">＋ 添加不等式</button>
    <div id="ineq-hint"></div>
    <button id="apply-btn2" onclick="applyF()">▶ 更新几何</button>
    <div id="f-status2"></div>
  </div>
</div>

<div id="controls">
  <!-- Card 1: Camera -->
  <div class="ctrl-card">
    <h3 id="card1-h3">视角</h3>
    <div class="ctrl-row"><label id="lbl-elev">仰角</label><input type="range" id="elev" min="5" max="85" value="28"><span class="val" id="elev-val">28°</span></div>
    <div class="ctrl-row"><label id="lbl-azim">方位角</label><input type="range" id="azim" min="0" max="360" value="210"><span class="val" id="azim-val">210°</span></div>
    <div class="ctrl-row"><label id="lbl-zoom">缩放</label><input type="range" id="zoom" min="3" max="14" step="0.5" value="7"><span class="val" id="zoom-val">7.0</span></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="ctrl-btn" id="anim-btn">▶ 自动旋转</button>
    </div>
  </div>
  <!-- Card 2: Geometry + Reset -->
  <div class="ctrl-card">
    <h3 id="card2-h3">几何参数</h3>
    <div class="ctrl-row"><label>y₀</label><input type="range" id="y0val" min="0.1" max="2.5" step="0.01" value="1.0"><span class="val" id="y0-val">1.00</span></div>
    <div id="y0-hint" style="font-size:11px;color:var(--text-hint);margin-bottom:10px;line-height:1.5"></div>
    <div class="btn-row"><button class="ctrl-btn" id="reset-btn">↺ 重置视角</button></div>
    <div class="reset-hint" id="reset-hint"></div>
    <div class="ctrl-row"><label id="lbl-r-elev">仰角</label><input type="number" id="r-elev" value="28" min="5" max="85"><span style="font-size:11px;color:var(--text-hint)">°</span></div>
    <div class="ctrl-row"><label id="lbl-r-azim">方位角</label><input type="number" id="r-azim" value="210" min="0" max="360"><span style="font-size:11px;color:var(--text-hint)">°</span></div>
    <div class="ctrl-row"><label id="lbl-r-zoom">缩放</label><input type="number" id="r-zoom" value="7" min="3" max="14" step="0.5"></div>
  </div>
  <!-- Card 3: Visibility -->
  <div class="ctrl-card">
    <h3 id="card3-h3">显示控制</h3>
    <label class="chk-row"><input type="checkbox" id="show-plane1" checked><span style="color:#3b82f6" id="chk-plane1">y₀=<span id="lbl-y0">1.00</span> 超平面（蓝）</span></label>
    <label class="chk-row"><input type="checkbox" id="show-plane0" checked><span style="color:#8b5cf6" id="chk-plane0">y₀=0 超平面（紫）</span></label>
    <label class="chk-row"><input type="checkbox" id="show-cone" checked><span id="chk-cone">锥面</span></label>
    <label class="chk-row"><input type="checkbox" id="show-section" checked><span id="chk-section">截面几何（橙色）</span></label>
    <label class="chk-row"><input type="checkbox" id="show-labels" checked><span id="chk-labels">坐标轴标注</span></label>
    <label class="chk-row"><input type="checkbox" id="show-ptlabels" checked><span id="chk-ptlabels">点坐标标注</span></label>
  </div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#f97316"></div><span id="leg1">射线 / 截面几何（橙）</span></div>
  <div class="leg"><div class="leg-dot" style="background:rgba(249,115,22,0.25);border:1px solid #f97316"></div><span id="leg2">锥面（半透明橙）</span></div>
  <div class="leg"><div class="leg-dot" style="background:rgba(59,130,246,0.5);border:1px solid #3b82f6"></div><span id="leg3">y₀=const 超平面（蓝）</span></div>
  <div class="leg"><div class="leg-dot" style="background:rgba(139,92,246,0.4);border:1px solid #8b5cf6"></div><span id="leg4">y₀=0 平面（紫）</span></div>
</div>

<div id="formula"></div>
<p class="tip" id="tip"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>

function makeLine(pts, col, dashed=false, opacity=1) {
  const mat = dashed
    ? new THREE.LineDashedMaterial({color:col, dashSize:.12, gapSize:.08, transparent:opacity<1, opacity})
    : new THREE.LineBasicMaterial({color:col, linewidth:2, transparent:opacity<1, opacity});
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
  if(dashed) l.computeLineDistances();
  return l;
}
function makeSprite(text, pos, col, size=0.55) {
  const c2=document.createElement('canvas'); c2.width=240; c2.height=96;
  const ctx=c2.getContext('2d');
  ctx.font='bold 40px serif'; ctx.fillStyle=col;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, 120, 48);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c2), transparent:true}));
  spr.position.copy(pos); spr.scale.set(size, size*.4, 1);
  return spr;
}
function rebuildSprite(spr, text, col, size) {
  const c2=document.createElement('canvas'); c2.width=280; c2.height=96;
  const ctx=c2.getContext('2d');
  ctx.font='bold 40px serif'; ctx.fillStyle=col;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, 140, 48);
  if(spr.material.map) spr.material.map.dispose();
  spr.material.map=new THREE.CanvasTexture(c2);
  spr.material.needsUpdate=true;
  if(size) spr.scale.set(size, size*.4, 1);
}

function buildFromPoints(pts){
  const dirs=pts.map(p=>new THREE.Vector3(p.x1,1,p.x2));
  dirs.forEach(d=>{
    rayGroup.add(makeLine([new THREE.Vector3(0,0,0),d.clone().multiplyScalar(RAY_EXT)],0xf97316));
  });
  if(dirs.length>=2){
    const hull=convexHullOrder(pts);
    for(let i=0;i<hull.length;i++){
      const a=hull[i],b=hull[(i+1)%hull.length];
      const A=dirs[a].clone().multiplyScalar(RAY_EXT);
      const B=dirs[b].clone().multiplyScalar(RAY_EXT);
      const geo=new THREE.BufferGeometry();
      geo.setAttribute('position',new THREE.BufferAttribute(
        new Float32Array([0,0,0,A.x,A.y,A.z,B.x,B.y,B.z]),3));
      coneGroup.add(new THREE.Mesh(geo,
        new THREE.MeshBasicMaterial({color:0xf97316,side:THREE.DoubleSide,transparent:true,opacity:.1})));
    }
  }
  updatePtSection(dirs,y0val,pts.map(p=>`(${p.x1},${p.x2})`));
}

    const dot=new THREE.Mesh(new THREE.SphereGeometry(.085,16,16),

let currentDirs=[];
let currentMode='pts';
let currentIneqFns=[];
let currentIneqSamples=[];

const SAMPLE_N=60, CLOUD_N=3000;

function buildFromIneqs(fns){
  currentIneqFns=fns;
  const valid=[];
  const lo=-0.2,hi=2.2,step=(hi-lo)/SAMPLE_N;
  for(let i=0;i<=SAMPLE_N;i++){
    for(let j=0;j<=SAMPLE_N;j++){
      const x1=lo+i*step,x2=lo+j*step;
      if(fns.every(f=>f(x1,x2))) valid.push({x1,x2});
    }
  }
  currentIneqSamples=valid;
  if(valid.length===0) return;

  const cloudPts=[];
  for(let k=0;k<CLOUD_N;k++){
    const s=valid[Math.floor(Math.random()*valid.length)];
    const jx=(Math.random()-.5)*step*.5;
    const jz=(Math.random()-.5)*step*.5;
    const dir=new THREE.Vector3(s.x1+jx,1,s.x2+jz);
    const t=RAY_EXT*(0.05+Math.random()*.95);
    cloudPts.push(dir.clone().multiplyScalar(t));
  }
  const cloudGeo=new THREE.BufferGeometry();
  cloudGeo.setAttribute('position',new THREE.BufferAttribute(
    new Float32Array(cloudPts.flatMap(p=>[p.x,p.y,p.z])),3));
  coneGroup.add(new THREE.Points(cloudGeo,
    new THREE.PointsMaterial({color:0xf97316,size:.04,transparent:true,opacity:.55})));

  const extremes=findExtremePoints(valid,6);
  currentDirs=extremes.map(p=>new THREE.Vector3(p.x1,1,p.x2));
  extremes.forEach(p=>{
    const dir=new THREE.Vector3(p.x1,1,p.x2);
    rayGroup.add(makeLine([new THREE.Vector3(0,0,0),dir.clone().multiplyScalar(RAY_EXT)],0xf97316,.5,.7));
  });
  updateIneqSection(y0val);
}

function updateIneqSection(v){
  while(sectionGroup.children.length) sectionGroup.remove(sectionGroup.children[0]);
  if(currentIneqSamples.length===0) return;
  const pts=[];
  currentIneqSamples.forEach(s=>{ pts.push(s.x1*v,v,s.x2*v); });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
  sectionGroup.add(new THREE.Points(geo,
    new THREE.PointsMaterial({color:0xf97316,size:.055,transparent:true,opacity:.85})));
}

function findExtremePoints(valid,n){
  if(valid.length<=n) return valid;
  return Array.from({length:n},(_,i)=>{
    const a=i*2*Math.PI/n, dx=Math.cos(a), dz=Math.sin(a);
    let best=valid[0],bv=-Infinity;
    valid.forEach(p=>{const v=p.x1*dx+p.x2*dz; if(v>bv){bv=v;best=p;}});
    return best;
  });
}

function convexHullOrder(pts){
  if(pts.length<=2) return pts.map((_,i)=>i);
  const ps=pts.map((p,i)=>({x:p.x1,y:p.x2,i}));
  ps.sort((a,b)=>a.y-b.y||a.x-b.x);
  const pivot=ps[0];
  ps.sort((a,b)=>Math.atan2(a.y-pivot.y,a.x-pivot.x)-Math.atan2(b.y-pivot.y,b.x-pivot.x));
  const hull=[];
  for(const p of ps){
    while(hull.length>=2){
      const a=hull[hull.length-2],b=hull[hull.length-1];
      if((b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x)<=0) hull.pop(); else break;
    }
    hull.push(p);
  }
  return hull.map(p=>p.i);
}

/* ════════════════════════════════════════════
   INEQUALITY PARSER
════════════════════════════════════════════ */
function parseIneq(str){
  str=str.trim();
  const ops=[['<=','le'],['>=','ge'],['<','lt'],['>','gt'],['==','eq'],['=','eq']];
  let op=null,lhsStr,rhsStr;
  for(const [sym,name] of ops){
    const idx=str.indexOf(sym);
    if(idx>=0){op=name;lhsStr=str.slice(0,idx).trim();rhsStr=str.slice(idx+sym.length).trim();break;}
  }
  if(!op) throw new Error(lang==='zh'?'未找到比较符号':'no comparison operator found');
  const lhsExpr=math.compile(lhsStr);
  const rhsExpr=math.compile(rhsStr);
  const cmp={le:(a,b)=>a<=b,ge:(a,b)=>a>=b,lt:(a,b)=>a<b,gt:(a,b)=>a>b,eq:(a,b)=>Math.abs(a-b)<1e-9};
  const fn=cmp[op];
  return (x1,x2)=>{
    const scope={x1,x2};
    return fn(lhsExpr.evaluate(scope), rhsExpr.evaluate(scope));
  };
}

  clearDynamic(); setStatus('','');

  if(currentUIMode==='pts'){
    const rows=[...document.getElementById('pts-area').querySelectorAll('.pt-row')];
    if(rows.length===0){setStatus(t.errNoPts,'err');return;}
    const pts=[];
    for(const r of rows){
      const inputs=r.querySelectorAll('input[type=number]');
      const x1=parseFloat(inputs[0].value), x2=parseFloat(inputs[1].value);
      if(isNaN(x1)||isNaN(x2)){setStatus(t.errBadCoord,'err');return;}
      pts.push({x1,x2});

    currentDirs=pts.map(p=>new THREE.Vector3(p.x1,1,p.x2));
    buildFromPoints(pts);

    const rows=[...document.getElementById('ineq-area').querySelectorAll('.ineq-row')];
    if(rows.length===0){setStatus(t.errNoIneq,'err');return;}
    const fns=[];
    for(const r of rows){
      const txt=r.querySelector('input[type=text]').value.trim();
      if(!txt) continue;
      try{fns.push(parseIneq(txt));}
      catch(e){setStatus(t.errParse(txt,e.message),'err');return;}
    }
    if(fns.length===0){setStatus(t.errEmpty,'err');return;}
    currentMode='ineq';
    buildFromIneqs(fns);
    if(currentIneqSamples.length===0){
      setStatus(t.warnEmpty,'err');
    } else {
      setStatus(t.okIneq(currentIneqSamples.length),'ok');
    }
  }
}

/* ════════════════════════════════════════════
   RESIZE / EVENTS
════════════════════════════════════════════ */
function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
}
resize(); window.addEventListener('resize',resize);

function syncUI(){
  document.getElementById('elev').value=Math.round(elev);
  document.getElementById('azim').value=Math.round(azim);
  document.getElementById('zoom').value=radius;
  document.getElementById('elev-val').textContent=Math.round(elev)+'°';
  document.getElementById('azim-val').textContent=Math.round(azim)+'°';
  document.getElementById('zoom-val').textContent=radius.toFixed(1);
}

document.getElementById('elev').addEventListener('input',e=>{elev=+e.target.value;document.getElementById('elev-val').textContent=elev+'°';updateCam();});
document.getElementById('azim').addEventListener('input',e=>{azim=+e.target.value;document.getElementById('azim-val').textContent=azim+'°';updateCam();});
document.getElementById('zoom').addEventListener('input',e=>{radius=+e.target.value;document.getElementById('zoom-val').textContent=(+e.target.value).toFixed(1);updateCam();});
document.getElementById('y0val').addEventListener('input',e=>{const v=parseFloat(e.target.value);document.getElementById('y0-val').textContent=v.toFixed(2);updateY0(v);});

document.getElementById('show-plane1').addEventListener('change',e=>{plane1Parts.forEach(p=>p.visible=e.target.checked);plane1Label.visible=e.target.checked;});
document.getElementById('show-plane0').addEventListener('change',e=>{plane0Group.visible=e.target.checked;plane0Label.visible=e.target.checked;});
document.getElementById('show-cone').addEventListener('change',e=>coneGroup.visible=e.target.checked);
document.getElementById('show-section').addEventListener('change',e=>{sectionGroup.visible=e.target.checked;ptLblGroup.visible=e.target.checked;});
document.getElementById('show-labels').addEventListener('change',e=>labelGroup.visible=e.target.checked);
document.getElementById('show-ptlabels').addEventListener('change',e=>ptLblGroup.visible=e.target.checked);

const animBtn=document.getElementById('anim-btn');
animBtn.addEventListener('click',()=>{
  animating=!animating;
  animBtn.textContent=animating?T[lang].animPause:T[lang].animPlay;
  animBtn.classList.toggle('active',animating);
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  elev=Math.max(5,Math.min(85,parseFloat(document.getElementById('r-elev').value)||28));
  azim=((parseFloat(document.getElementById('r-azim').value)||210)%360+360)%360;
  radius=Math.max(3,Math.min(14,parseFloat(document.getElementById('r-zoom').value)||7));
  syncUI(); updateCam();
});

let drag=false,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  azim=(azim+(e.clientX-lx)*.45+360)%360;
  elev=Math.max(5,Math.min(85,elev-(e.clientY-ly)*.35));
  lx=e.clientX;ly=e.clientY; syncUI(); updateCam();
});
canvas.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('touchend',()=>drag=false);
canvas.addEventListener('touchmove',e=>{
  if(!drag)return;
  azim=(azim+(e.touches[0].clientX-lx)*.45+360)%360;
  elev=Math.max(5,Math.min(85,elev-(e.touches[0].clientY-ly)*.35));
  lx=e.touches[0].clientX;ly=e.touches[0].clientY; syncUI(); updateCam();
},{passive:true});
canvas.addEventListener('wheel',e=>{
  radius=Math.max(3,Math.min(14,radius+e.deltaY*.01));
  document.getElementById('zoom').value=radius;
  document.getElementById('zoom-val').textContent=radius.toFixed(1);
  updateCam(); e.preventDefault();
},{passive:false});

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
addIneqRow('x1 >= 0');
addIneqRow('x2 >= 0');
addIneqRow('x1 + x2 <= 1');
addPointRow(0,0); addPointRow(1,0); addPointRow(0,1); addPointRow(1,1);

updateY0(1.0); updateCam();
applyLang();   // apply zh strings on load
// sync anim button to initial animating=true state
document.getElementById('anim-btn').textContent = T[lang].animPause;
document.getElementById('anim-btn').classList.add('active');
applyF();

(function render(){
  requestAnimationFrame(render);
  if(animating){azim=(azim+.22)%360; syncUI(); updateCam();}
  renderer.render(scene,cam);
})();
</script>
